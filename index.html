<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A to-do list that saves your tasks in the browser using localStorage.">
  <title>To-Do List with LocalStorage</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>My tasks</h1>
      <p class="intro">Add what you need to do. Your list stays here even after you reload.</p>
    </header>

    <form id="form" class="add-form" autocomplete="off">
      <label for="text" class="visually-hidden">New task</label>
      <input id="text" name="text" type="text" placeholder="What needs doing?" maxlength="120" required>
      <button class="btn" type="submit">Add task</button>
    </form>

    <div class="toolbar" role="group" aria-label="Filter tasks">
      <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
      <button class="filter" type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list" class="task-list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="app-footer">
      <p id="count" class="count" aria-live="polite">0 tasks left</p>
      <button id="clear" class="btn btn-ghost" type="button">Clear completed</button>
    </footer>
  </main>
</body>
</html>
